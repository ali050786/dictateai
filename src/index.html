<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- data: scripts: the audio worklet in renderer.ts is loaded from a data: URL -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws://localhost:*; base-uri 'none'; form-action 'none'; script-src 'self' data:; media-src 'self' mediastream: blob:" />
    <title>DictateAI</title>
  </head>
  <body>
    <div id="flow-bar" class="flow-bar idle">
      <div id="waveform" class="waveform">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
      <span id="label" class="label"></span>
      <span id="preview" class="preview"></span>
      <button id="close-btn" class="close-btn" aria-label="Stop recording">×</button>
    </div>
  </body>
</html>
